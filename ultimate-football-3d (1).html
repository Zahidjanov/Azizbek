attachJoystick(){const joy=this.shell.querySelector('#joy'),stick=this.shell.querySelector('#stick');let active=false;const move=e=>{if(!active)return;const r=joy.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-r.width/2,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-r.height/2;const m=Math.min(30,Math.hypot(x,y)),a=Math.atan2(y,x);stick.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`;this.joy={x:Math.cos(a)*Math.min(1,Math.abs(x)/35),y:Math.sin(a)*Math.min(1,Math.abs(y)/35)}};const end=()=>{active=false;stick.style.transform='';this.joy={x:0,y:0}};joy.addEventListener('pointerdown',e=>{active=true;joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',move);joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);this.joy={x:0,y:0}}
update(dt){this.t+=dt;const p=this.home[this.selected];let dx=0,dy=0;if(this.keys.w||this.keys.arrowup)dy-=1;if(this.keys.s||this.keys.arrowdown)dy+=1;if(this.keys.a||this.keys.arrowleft)dx-=1;if(this.keys.d||this.keys.arrowright)dx+=1;dx+=this.joy.x;dy+=this.joy.y;const mag=Math.hypot(dx,dy)||1;const sprint=this.keys.shift?1.55:1;p.x=Math.max(-.94,Math.min(.94,p.x+dx/mag*dt*.65*sprint));p.y=Math.max(-.88,Math.min(.88,p.y+dy/mag*dt*.65*sprint));if(Math.abs(dx)+Math.abs(dy)>0.1){this.ball.x+=(p.x-this.ball.x)*Math.min(1,dt*7);this.ball.y+=(p.y-this.ball.y)*Math.min(1,dt*7)}this.ball.vy+=dt*.16;this.ball.x+=this.ball.vx*dt;this.ball.y+=this.ball.vy*dt;this.ball.vx*=Math.pow(.08,dt);this.ball.vy*=Math.pow(.08,dt);this.ball.z+=this.ball.vz*dt;this.ball.vz-=dt*.8;if(this.ball.z<0){this.ball.z=0;this.ball.vz*=-.35}if(this.ball.y<-.95&&Math.abs(this.ball.x)<.42&&this.ball.vy<-.1)this.maybeGoal();this.home.forEach((q,i)=>{if(i===this.selected)return;const wob=Math.sin(this.t*(.7+q.speed)+i)*.035;q.x+=(q.bx+wob-q.x)*dt*.8;q.y+=(q.by+Math.cos(this.t+i)*.025-q.y)*dt*.8});this.away.forEach((q,i)=>{const target=i===10?{x:this.ball.x,y:this.ball.y}:{x:q.bx+(this.ball.x-q.bx)*.06,y:q.by+(this.ball.y-q.by)*.06};q.x+=(target.x-q.x)*dt*(.4+q.speed*.55);q.y+=(target.y-q.y)*dt*(.4+q.speed*.55)});if(this.t>35&&Math.random()<dt*.018){state.match.away++;this.updateScore();this.event('Away counter · goal conceded')}}
draw(){const c=this.ctx,w=this.w,h=this.h;c.clearRect(0,0,w,h);const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#193c36');g.addColorStop(.46,'#102923');g.addColorStop(1,'#07130f');c.fillStyle=g;c.fillRect(0,0,w,h);const horizon=h*.25;for(let i=0;i<7;i++){c.fillStyle=i%2?'#263d36':'#1c312d';c.fillRect(0,horizon-30+i*15,w,15)}for(let i=0;i<22;i++){c.fillStyle=i%3?'#6f9380':'#b7f36b';c.beginPath();c.arc((i*83+this.t*8)%w,horizon-10+(i%3)*7,2,0,Math.PI*2);c.fill()}const top=h*.28,bottom=h*.97,left=w*.18,right=w*.82;const pitch=c.createLinearGradient(0,top,0,bottom);pitch.addColorStop(0,'#1d6b48');pitch.addColorStop(1,'#0c432d');c.fillStyle=pitch;c.beginPath();c.moveTo(w*.32,top);c.lineTo(w*.68,top);c.lineTo(right,bottom);c.lineTo(left,bottom);c.closePath();c.fill();for(let i=0;i<10;i++){c.strokeStyle=i%2?'#ffffff0b':'#ffffff06';c.lineWidth=1;c.beginPath();const yy=top+(bottom-top)*i/10;c.moveTo(w*.32-(w*.14*i/10),yy);c.lineTo(w*.68+(w*.14*i/10),yy);c.stroke()}const project=(x,y,z=0)=>{const py=top+(y+.9)/1.8*(bottom-top);const widen=(py-top)/(bottom-top);return [w/2+x*(w*.18+widen*w*.32),py-z*80];};c.strokeStyle='#d9f8d544';c.lineWidth=2;c.beginPath();let a=project(-1,-.9),b=project(1,-.9),d=project(1,.9),e=project(-1,.9);c.moveTo(...a);c.lineTo(...b);c.lineTo(...d);c.lineTo(...e);c.closePath();c.stroke();let mid1=project(-.9,0),mid2=project(.9,0);c.beginPath();c.moveTo(...mid1);c.lineTo(...mid2);c.stroke();c.beginPath();const cc=project(0,0);c.arc(cc[0],cc[1],(w*.09),0,Math.PI*2);c.stroke();const drawPlayer=(q,team,i)=>{const [x,y]=project(q.x,q.y);const scale=.55+((q.y+.9)/1.8)*.55;const r=7*scale;c.fillStyle='#0008';c.beginPath();c.ellipse(x,y+5*scale,r*1.15,r*.48,0,0,Math.PI*2);c.fill();c.fillStyle=team==='home'?'#7fdc8b':'#ff7770';c.beginPath();c.roundRect(x-r,y-r*1.35,r*2,r*2.25,3);c.fill();c.fillStyle='#f2b18b';c.beginPath();c.arc(x,y-r*1.55,r*.72,0,Math.PI*2);c.fill();if(team==='home'&&i===this.selected){c.strokeStyle='#d5ff8c';c.lineWidth=2;c.beginPath();c.arc(x,y-r*.4,r*1.65,0,Math.PI*2);c.stroke()}c.fillStyle='#06140f';c.font=`${Math.max(7,8*scale)}px system-ui`;c.textAlign='center';c.fillText(i+1,x,y+.8*scale)};this.away.forEach((q,i)=>drawPlayer(q,'away',i));this.home.forEach((q,i)=>drawPlayer(q,'home',i));const [bx,by]=project(this.ball.x,this.ball.y,this.ball.z);c.fillStyle='#0007';c.beginPath();c.ellipse(bx,by+5,bx?5:5,2.5,0,0,Math.PI*2);c.fill();c.fillStyle='#f5f6ec';c.beginPath();c.arc(bx,by-4,5,0,Math.PI*2);c.fill();c.strokeStyle='#162a22';c.lineWidth=1;c.stroke()}
loop=()=>{if(!this.running)return;const now=performance.now(),dt=Math.min(.05,(now-this.last)/1000);this.last=now;this.update(dt);this.draw();const clock=this.shell.querySelector('#match-clock');clock.textContent=String(Math.floor(this.t/60)).padStart(2,'0')+':'+String(Math.floor(this.t%60)).padStart(2,'0')+'  •  FRIENDLY';requestAnimationFrame(this.loop)}
exit(){this.running=false;window.removeEventListener('resize',this.resize);window.removeEventListener('keydown',this.bind);this.shell.remove();state.match=null;save();render()}}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
